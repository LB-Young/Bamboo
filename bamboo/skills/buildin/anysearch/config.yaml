schema_version: 1
name: anysearch
enabled: true
user_invocable: true
load_experiences: false
load_policy:
  auto_select: true
  max_references: 0
  max_tokens: 4000
requirements:
  bins:
    - python3
  env:
    - ANYSEARCH_API_KEY
  python_packages: []
permissions:
  can_run_commands: true
  can_edit_files: false
  can_access_network: true
