schema_version: 1

# Central defaults for Bamboo built-in workflows.
# WorkflowRegistry reads `enabled`, `description`, `usage`, `dependencies`, and `run`.
# Other entries are read by the corresponding workflow implementation when needed.
workflows:
  daily-review:
    enabled: true
    user_invocable: true
    dependencies:
      - bash tool
    run:
      script: scripts/project_snapshot.sh
      cwd: .
      timeout: 60
      risk: read

  local-pdf-to-markdown:
    enabled: true
    user_invocable: true
    description: Convert a local PDF file into a structured Markdown document with a retained JSON IR and extracted assets.
    usage: |
      1. Call `workflow_load` with `name="local-pdf-to-markdown"` before running this workflow.
      2. Call `workflow_run` with `name="local-pdf-to-markdown"` and arguments containing a local PDF path.
      3. Arguments may be either `"/absolute/input.pdf"` or `"/absolute/input.pdf /absolute/output.md"`.
      4. The workflow returns the generated Markdown file path in stdout as `Markdown: ...`.
    variables:
      PDF2MD_MODELS_DIR: /Users/liubaoyang/Documents/YoungL/models
      PDF2MD_LAYOUT_MODEL_NAME: PP-DocLayout_plus-L
      PDF2MD_LAYOUT_MODEL_DIR: /Users/liubaoyang/Documents/YoungL/models/PP-DocLayout/PP-DocLayout_plus-L
      PDF2MD_DPI: "180"
      PDF2MD_LAYOUT_DEVICE: cpu
      PDF2MD_ENABLE_OCR: "auto"
      PDF2MD_OCR_DETECTION_MODEL_NAME: PP-OCRv5_mobile_det
      PDF2MD_OCR_RECOGNITION_MODEL_NAME: PP-OCRv5_mobile_rec
      PDF2MD_OCR_DETECTION_MODEL_DIR: /Users/liubaoyang/Documents/YoungL/models/PP-OCRv5/PP-OCRv5_mobile_det
      PDF2MD_OCR_RECOGNITION_MODEL_DIR: /Users/liubaoyang/Documents/YoungL/models/PP-OCRv5/PP-OCRv5_mobile_rec
    requirements:
      bins:
        - python
      python_packages:
        - PyMuPDF
        - Pillow
        - paddleocr
        - paddlepaddle
      optional_python_packages: []
    permissions:
      can_run_commands: true
      can_edit_files: true
      can_access_network: false
    run:
      script: scripts/pdf_to_markdown.py
      cwd: .
      timeout: 1800
      risk: write

  video-insight:
    enabled: true
    user_invocable: true
    description: Extract audio, transcripts, keyframes, OCR text, keyframe descriptions, and visual summaries from a local video file.
    usage: |
      1. Call `workflow_load` with `name="video-insight"` before running this workflow.
      2. Call `workflow_run` with `name="video-insight"` and arguments containing a local video path.
      3. Arguments may be either `"/absolute/input.mp4"` or `"/absolute/input.mp4" "/absolute/output-dir"`.
      4. Extra flags are supported, such as `--skip-transcript`, `--skip-vision`, `--skip-ocr`, `--device cuda`, and `--vision-model-dir /models/vision-language-model`.
      5. The workflow returns the output directory and key artifact paths in stdout.
    variables:
      # Whisper 语音转写模型目录，避免使用默认缓存路径。
      VIDEO_INSIGHT_MODEL_DIR: "${VIDEO_INSIGHT_MODEL_DIR}"
      # 本地多模态视觉模型配置，用于关键帧描述和画面总结。
      VIDEO_INSIGHT_VISION_MODEL_DIR: "${VIDEO_INSIGHT_VISION_MODEL_DIR}"
      VIDEO_INSIGHT_VISION_DEVICE: auto
      VIDEO_INSIGHT_VISION_DTYPE: bfloat16
      VIDEO_INSIGHT_VISION_MAX_NEW_TOKENS: "512"
      VIDEO_INSIGHT_MAX_VISION_FRAMES: "12"
      VIDEO_INSIGHT_ANALYSIS_LANGUAGE: zh-CN
      # PaddleOCR 配置，用于关键帧中文字识别。
      VIDEO_INSIGHT_ENABLE_OCR: auto
      VIDEO_INSIGHT_OCR_DETECTION_MODEL_NAME: PP-OCRv5_mobile_det
      VIDEO_INSIGHT_OCR_RECOGNITION_MODEL_NAME: PP-OCRv5_mobile_rec
      VIDEO_INSIGHT_OCR_DETECTION_MODEL_DIR: /Users/liubaoyang/Documents/YoungL/models/PP-OCRv5/PP-OCRv5_mobile_det
      VIDEO_INSIGHT_OCR_RECOGNITION_MODEL_DIR: /Users/liubaoyang/Documents/YoungL/models/PP-OCRv5/PP-OCRv5_mobile_rec
    requirements:
      bins:
        - python
        - ffmpeg
        - ffprobe
      env:
        - VIDEO_INSIGHT_MODEL_DIR
      optional_env:
        - VIDEO_INSIGHT_VISION_MODEL_DIR
      optional_python_packages:
        - faster-whisper
        - paddleocr
        - paddlepaddle
        - torch
        - transformers
        - accelerate
        - qwen-vl-utils
    permissions:
      can_run_commands: true
      can_edit_files: true
      can_access_network: false
    run:
      script: scripts/run_video_insight.py
      cwd: .
      timeout: 7200
      risk: write

  extracted-content-to-wechat-article:
    enabled: true
    user_invocable: true
    description: Build a WeChat public-account article package from one or more extracted content directories and an article Markdown draft.
    usage: |
      1. Extract source material first. The extractor can be a workflow, skill, or tool for PDFs, web pages, videos, social posts, or WeChat articles.
      2. Put each extracted source's Markdown and local assets under one content directory, then draft the WeChat article as Markdown.
      3. Call `workflow_load` with `name="extracted-content-to-wechat-article"`.
      4. Call `workflow_run` with arguments:
         `"<content-dir-1> [<content-dir-2> ...] <article-draft.md> <output-dir> [--title TITLE] --cover <cover.png> [--verify-links]"`
      5. Review the generated DOCX, normalized Markdown, asset manifest, link report, and quality report.
    requirements:
      bins:
        - python
      python_packages:
        - python-docx
        - Pillow
      optional_python_packages:
        - matplotlib
    permissions:
      can_run_commands: true
      can_edit_files: true
      can_access_network: true
    run:
      script: scripts/build_wechat_article.py
      cwd: .
      timeout: 1800
      risk: network
