schema_version: 1

# Central defaults for Bamboo built-in skills.
# SkillRegistry only reads `enabled`.
# Other entries are read by the corresponding skill implementation when needed.
skills:
  anysearch:
    enabled: true
    user_invocable: true
    load_experiences: false
    load_policy:
      auto_select: true
      max_references: 0
      max_tokens: 4000
    variables:
      ANYSEARCH_API_KEY: "${ANYSEARCH_API_KEY}"
    requirements:
      bins:
        - python3
      env:
        - ANYSEARCH_API_KEY
      python_packages: []
    permissions:
      can_run_commands: true
      can_edit_files: false
      can_access_network: true

  github-reach:
    enabled: true
    user_invocable: true
    load_experiences: false
    load_policy:
      auto_select: true
      max_references: 0
      max_tokens: 3500
    variables:
      GITHUB_REACH_USER_AGENT: "Bamboo GitHub Reach/1"
    requirements:
      bins:
        - python3
      env: []
      python_packages: []
    permissions:
      can_run_commands: true
      can_edit_files: false
      can_access_network: true

