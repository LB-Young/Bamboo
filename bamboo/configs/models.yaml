# 默认模型必须引用下面 models 中的注册名。
default_model: kimi-k3

# Agent 只使用模型注册名；Provider、实际模型 ID 和连接参数统一在这里维护。
# 本地模型可用显式发现命令生成配置片段，不会在启动时自动探测：
#   bamboo models discover ollama
#   bamboo models discover vllm
# 如需写入用户配置，先检查输出，再运行：
#   bamboo models discover ollama --write
models:
  kimi-k3:
    provider: kimi
    model: kimi-k3
    model_type: vision
    prompt_profile: kimi
    api_key: "${MOONSHOT_API_KEY}"
    base_url: https://api.moonshot.cn/v1
    timeout: 60
    context_window: 1000000
    max_tokens: 4096
    extra_body:
      reasoning_effort: max
    capabilities:
      tool_calling: true
      json_schema: false
      vision: true
      max_parallel_tools: 1

  deepseek-chat:
    provider: deepseek
    model: deepseek-chat
    model_type: text
    prompt_profile: deepseek
    api_key: ""
    base_url: https://api.deepseek.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 128000
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: false
      vision: false
      max_parallel_tools: 1

  minimax-m3:
    provider: minimax
    model: MiniMax-M3
    model_type: text
    prompt_profile: minimax
    api_key: ""
    base_url: https://api.minimaxi.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 1000000
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: false
      vision: false
      max_parallel_tools: 1

  mimo-default:
    provider: mimo
    model: mimo-v2.5-pro
    model_type: vision
    prompt_profile: mimo
    api_key: ""
    base_url: https://api.xiaomimimo.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 128000
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: false
      vision: true
      max_parallel_tools: 1

  gpt-default:
    provider: gpt
    model: gpt-4.1-mini
    model_type: text
    prompt_profile: gpt
    api_key: ""
    base_url: https://api.openai.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 1047576
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: true
      vision: false
      max_parallel_tools: 1

  claude-default:
    provider: claude
    model: claude-sonnet-4-5
    model_type: text
    prompt_profile: claude
    api_key: ""
    base_url: https://api.anthropic.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 200000
