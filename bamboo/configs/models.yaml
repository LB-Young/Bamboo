# 默认模型必须引用下面 models 中的注册名。
default_model: kimi-k3

# Agent 只使用模型注册名；Provider、实际模型 ID 和连接参数统一在这里维护。
# 本地模型可用显式发现命令生成配置片段，不会在启动时自动探测：
#   bamboo models discover ollama
#   bamboo models discover vllm
# 如需写入用户配置，先检查输出，再运行：
#   bamboo models discover ollama --write
models:
  kimi-k3:
    provider: kimi
    model: kimi-k3
    model_type: vision
    prompt_profile: kimi
    api_key: "${MOONSHOT_API_KEY}"
    base_url: https://api.moonshot.cn/v1
    timeout: 60
    context_window: 1000000
    max_tokens: 4096
    extra_body:
      reasoning_effort: max
    capabilities:
      tool_calling: true
      json_schema: false
      vision: true
      max_parallel_tools: 1

  deepseek-chat:
    provider: deepseek
    model: deepseek-chat
    model_type: text
    prompt_profile: deepseek
    api_key: ""
    base_url: https://api.deepseek.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 128000
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: false
      vision: false
      max_parallel_tools: 1

  minimax-m3:
    provider: minimax
    model: MiniMax-M3
    model_type: text
    prompt_profile: minimax
    api_key: ""
    base_url: https://api.minimaxi.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 1000000
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: false
      vision: false
      max_parallel_tools: 1

  mimo-default:
    provider: mimo
    model: mimo-v2.5-pro
    model_type: vision
    prompt_profile: mimo
    api_key: ""
    base_url: https://api.xiaomimimo.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 128000
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: false
      vision: true
      max_parallel_tools: 1

  gpt-default:
    provider: gpt
    model: gpt-4.1-mini
    model_type: text
    prompt_profile: gpt
    api_key: ""
    base_url: https://api.openai.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 1047576
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: true
      vision: false
      max_parallel_tools: 1

  claude-default:
    provider: claude
    model: claude-sonnet-4-5
    model_type: text
    prompt_profile: claude
    api_key: ""
    base_url: https://api.anthropic.com/v1
    timeout: 60
    temperature: 0.2
    context_window: 200000
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: false
      vision: false
      max_parallel_tools: 1

  ollama-local:
    provider: ollama
    model: qwen2.5:7b
    model_type: text
    prompt_profile: ollama
    api_key: ""
    base_url: http://localhost:11434/v1
    timeout: 120
    temperature: 0.2
    context_window: 32768
    max_tokens: 4096
    capabilities:
      tool_calling: false
      json_schema: false
      vision: false
      max_parallel_tools: 1

  vllm-local:
    provider: vllm
    model: Qwen/Qwen2.5-7B-Instruct
    model_type: text
    prompt_profile: vllm
    api_key: ""
    base_url: http://localhost:8000/v1
    timeout: 120
    temperature: 0.2
    context_window: 32768
    max_tokens: 4096
    capabilities:
      tool_calling: false
      json_schema: false
      vision: false
      max_parallel_tools: 1

  http-provider-local-openai:
    provider: http_provider
    model: local_openai-gpt-5.2-chat
    model_type: text
    prompt_profile: gpt
    api_key: "sk-"
    base_url: http://bg-brush-api.testing.srv.ddns.temu.team/brush/api/pie/callLargeModelProxy
    timeout: 60
    temperature: 1.0
    context_window: 128000
    max_tokens: 4096
    capabilities:
      tool_calling: false
      json_schema: false
      vision: false
      max_parallel_tools: 1
    extra_body:
      timeout: 30

  aliyun-qwen-plus:
    provider: aliyun
    model: qwen-plus
    model_type: text
    prompt_profile: aliyun
    api_key: "${DASHSCOPE_API_KEY}"
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    timeout: 60
    temperature: 0.2
    context_window: 128000
    max_tokens: 4096
    capabilities:
      tool_calling: true
      json_schema: false
      vision: false
      max_parallel_tools: 1

  aliyun-wanx-t2i:
    provider: aliyun
    model: wanx2.1-t2i-turbo
    model_type: image_generation
    prompt_profile: aliyun
    api_key: "${DASHSCOPE_API_KEY}"
    base_url: https://dashscope.aliyuncs.com/api/v1
    timeout: 120
    context_window: 4096
    max_tokens: 1024
    capabilities:
      tool_calling: false
      json_schema: false
      vision: false
      max_parallel_tools: 1
    extra_body:
      protocol: dashscope_async
      endpoint: /services/aigc/text2image/image-synthesis
      parameters:
        size: 1024*1024
        n: 1

  aliyun-wanx-image-edit:
    provider: aliyun
    model: wanx2.1-imageedit
    model_type: image_edit
    prompt_profile: aliyun
    api_key: "${DASHSCOPE_API_KEY}"
    base_url: https://dashscope.aliyuncs.com/api/v1
    timeout: 120
    context_window: 4096
    max_tokens: 1024
    capabilities:
      tool_calling: false
      json_schema: false
      vision: false
      max_parallel_tools: 1
    extra_body:
      protocol: dashscope_async
      endpoint: /services/aigc/image2image/image-synthesis
      input_fields:
        image_url: base_image_url

  aliyun-wanx-t2v:
    provider: aliyun
    model: wan2.7-t2v-2026-06-12
    model_type: video_generation
    prompt_profile: aliyun
    api_key: "${DASHSCOPE_API_KEY}"
    base_url: https://dashscope.aliyuncs.com/api/v1
    timeout: 120
    context_window: 4096
    max_tokens: 1024
    capabilities:
      tool_calling: false
      json_schema: false
      vision: false
      max_parallel_tools: 1
    extra_body:
      protocol: dashscope_async
      endpoint: /services/aigc/video-generation/video-synthesis

  openrouter-gpt-5-image-mini:
    provider: openrouter
    model: openai/gpt-5-image-mini
    model_type: image_generation
    prompt_profile: openrouter
    api_key: "${OPENROUTER_API_KEY}"
    base_url: https://openrouter.ai/api/v1
    timeout: 180
    context_window: 4096
    max_tokens: 1024
    capabilities:
      tool_calling: false
      json_schema: false
      vision: false
      max_parallel_tools: 1
    extra_body:
      protocol: openrouter_images
      endpoint: /images
      parameters:
        n: 1
