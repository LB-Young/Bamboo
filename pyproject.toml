[project]
name = "bamboo"
version = "0.1.0"
description = "Bamboo - AI-powered personal agent assistant"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx[socks]>=0.27.0",
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "loguru>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "chromadb>=0.5.0",
    "sqlite-minutils>=3.0.0",
    "croniter>=2.0.0",
    "rich>=13.0.0",
    "PyYAML>=6.0.0",
    "playwright>=1.40.0",
    "pywebview>=5.0",
    "qrcode>=7.4",
    "skillspector @ git+https://github.com/NVIDIA/skillspector.git@3f11bfa4117ed8beff02d45f660f557489f6bbe5",
]

[project.scripts]
bamboo = "bamboo.run:app"

[tool.setuptools]
packages = [
    "bamboo",
    "bamboo.bkn",
    "bamboo.bkn.operators",
    "bamboo.cron",
    "bamboo.eval",
    "bamboo.commands",
    "bamboo.adapters",
    "bamboo.adapters.app",
    "bamboo.adapters.app_fancy",
    "bamboo.adapters.cli",
    "bamboo.adapters.web",
    "bamboo.adapters.web_fancy",
    "bamboo.adapters.wechat",
    "bamboo.runtime",
    "bamboo.prompts",
    "bamboo.subagents",
    "bamboo.llms",
    "bamboo.llms.providers",
    "bamboo.memory",
    "bamboo.plugins",
    "bamboo.security",
    "bamboo.tools",
    "bamboo.tools.buildin",
    "bamboo.tools.mcp",
    "bamboo.workflows",
    "bamboo.skills",
    "bamboo.skills.buildin",
]

[tool.setuptools.package-data]
bamboo = [
    "configs/*.yaml",
    "prompts/*/*.md",
    "prompts/provider/*/*.md",
    "adapters/web/static/*.html",
    "adapters/web/static/*.js",
    "adapters/web/static/*.css",
    "adapters/web_fancy/static/*.html",
    "adapters/web_fancy/static/*.js",
    "adapters/web_fancy/static/*.css",
    "adapters/app/static/*.html",
    "adapters/app/static/*.js",
    "adapters/app/static/*.css",
    "adapters/app_fancy/static/*.html",
    "adapters/app_fancy/static/*.js",
    "adapters/app_fancy/static/*.css",
    "adapters/app_fancy/static/assets/*.ico",
    "adapters/app_fancy/static/assets/*.icns",
    "adapters/app_fancy/static/assets/*.png",
    "adapters/app_fancy/static/assets/*.svg",
    "commands/buildin/*.md",
    "memory/templates/*/*.md",
    "subagents/buildin/*.yaml",
    "skills/buildin/*/SKILL.md",
    "skills/buildin/*/scripts/*",
    "skills/buildin/*/experiences/*.md",
    "workflows/buildin/*/WORKFLOW.md",
    "workflows/buildin/*/scripts/*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx[socks]>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
